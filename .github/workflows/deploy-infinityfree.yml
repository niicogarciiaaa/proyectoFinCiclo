# Despliegue automático a InfinityFree en cada push a main.
#  - Frontend: compila Angular (producción) y sube dist/autocarehub/browser
#    a /htdocs/Autocare/frontend/
#  - Backend: sube la carpeta PHP/ a /htdocs/Autocare/BACKEND/
#    (sin config/database.php, que en el servidor tiene los datos de la BD
#    de InfinityFree y no debe sobrescribirse).
#
# Secretos necesarios (GitHub > Settings > Secrets and variables > Actions):
#   FTP_SERVER   -> p. ej. ftpupload.net
#   FTP_USERNAME -> p. ej. if0_12345678
#   FTP_PASSWORD -> contraseña FTP de la cuenta de InfinityFree

name: Deploy InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AUTOCAREHUB/package-lock.json

      - name: Compilar Angular (producción)
        working-directory: AUTOCAREHUB
        run: |
          npm ci
          npx ng build --configuration production

      - name: Subir frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: AUTOCAREHUB/dist/autocarehub/browser/
          server-dir: /htdocs/Autocare/frontend/
          timeout: 120000

      - name: Subir backend PHP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: PHP/
          server-dir: /htdocs/Autocare/BACKEND/
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            config/database.php
            logs/**
